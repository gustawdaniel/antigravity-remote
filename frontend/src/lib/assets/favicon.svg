<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="180" stroke="url(#orbitGrad)" stroke-width="12" fill="none" opacity="0.3" />
  <ellipse cx="256" cy="256" rx="160" ry="80" stroke="url(#orbitGrad)" stroke-width="14" fill="none" transform="rotate(-30 256 256)" filter="url(#glow)" />
  <ellipse cx="256" cy="256" rx="160" ry="80" stroke="#38bdf8" stroke-width="8" fill="none" transform="rotate(30 256 256)" opacity="0.8" />
  <circle cx="256" cy="256" r="42" fill="#6366f1" filter="url(#glow)" />
  <circle cx="256" cy="256" r="28" fill="#e0e7ff" />
  <circle cx="360" cy="180" r="16" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="150" cy="310" r="12" fill="#a855f7" filter="url(#glow)" />
</svg>
